name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The workstation Dockerfile installs ARM64 binaries.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read tool versions
        id: versions
        run: sed -n -e 's/^UV_VERSION=/uv=/p' -e 's/^NODE_VERSION=/node=/p' .env.example >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.versions.outputs.uv }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            requirements/*.txt
      - name: Install integration prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring
          curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/install-claude.sh"
          bash "$RUNNER_TEMP/install-claude.sh" latest
          node scripts/setup-codex.ts
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the Jira MCP server
        run: |
          git init -q "$RUNNER_TEMP/jira-server"
          git -C "$RUNNER_TEMP/jira-server" fetch --depth=1 https://github.com/stolostron/jira-mcp-server.git 12b3af14b337771c03b94c069eb7cd748588f42a
          git -C "$RUNNER_TEMP/jira-server" checkout --detach FETCH_HEAD
          uv venv --python 3.12 "$RUNNER_TEMP/jira-venv"
          uv pip install --python "$RUNNER_TEMP/jira-venv/bin/python" --require-hashes -r requirements/jira-mcp.txt
          uv pip install --python "$RUNNER_TEMP/jira-venv/bin/python" --no-deps --no-build-isolation -e "$RUNNER_TEMP/jira-server"
          echo "$RUNNER_TEMP/jira-venv/bin" >> "$GITHUB_PATH"
      - name: Run code checks and tests
        run: npm run check -- lint format-check types tests lifecycle jira
      - name: Verify bootstrap and isolated Workspace MCP startup
        if: ${{ !cancelled() }}
        run: npm run check -- bootstrap mcp
      - name: Keep verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-evidence
          path: verifications/evidence/

  podman-image:
    name: Podman image build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned Node version
        id: versions
        run: sed -n 's/^NODE_VERSION=/node=/p' .env.example >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Build with Podman
        run: node verifications/scripts/build-image.ts podman
      - name: Keep image build evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podman-image-evidence
          path: verifications/evidence/*/container-image/
