name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The workstation Dockerfile installs ARM64 binaries.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read tool versions
        id: versions
        run: sed -n -e 's/^UV_VERSION=/uv=/p' -e 's/^NODE_VERSION=/node=/p' .env.example >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
      - run: npm ci
      - run: npm run discover
      - run: npm run typecheck
      - run: npm test
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.versions.outputs.uv }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            requirements/*.txt
      - name: Install verification runner and Codex
        id: tools
        run: |
          bash scripts/setup-verification.sh
          curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run code checks and tests
        run: nox -s lint types shell tests
      - name: Verify bootstrap and MCP
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: nox -s integration -- --bootstrap-only
      - name: Show integration logs on failure
        if: failure()
        run: |
          if [ -d verifications/evidence ]; then
            find verifications/evidence -type f -name '*.log' -exec tail -n 80 {} +
          fi

  podman-image:
    name: Podman image build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned Node version
        id: versions
        run: sed -n 's/^NODE_VERSION=/node=/p' .env.example >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - name: Build with Podman
        run: node verifications/scripts/build-image.ts podman
      - name: Keep image build evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podman-image-evidence
          path: verifications/evidence/*/container-image/
