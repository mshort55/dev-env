services:
  dev:
    build:
      context: .devcontainer/dev
      args:
        - CONTAINER_USER
        - CONTAINER_UID
        - WORKSPACE_DIR_NAME
    image: dev-env:latest
    container_name: dev
    command: tail -f /dev/null
    environment:
      - USER=${CONTAINER_USER}
      - DEV_ENV_DIR
      - KEEPASS_DB_PATH
    volumes:
      - ${HOST_GENERAL_DIR}/.bash_history:/home/${CONTAINER_USER}/.bash_history
      - ${HOST_GENERAL_DIR}/.claude:/home/${CONTAINER_USER}/.claude
      - ${HOST_BINARIES_DIR}:/home/${CONTAINER_USER}/Binaries
      - ${HOST_REPOS_DIR}:/${REPOS_DIR_NAME}
      - ${HOST_WORKSPACE_DIR}:/${WORKSPACE_DIR_NAME}

  ruflo:
    build:
      context: .
      dockerfile: .devcontainer/ruflo/Dockerfile
      args:
        - CONTAINER_USER
        - CONTAINER_UID
        - RUFLO_DIR_NAME
    image: dev-env-ruflo:latest
    container_name: ruflo
    command: tail -f /dev/null
    environment:
      - CLAUDE_FLOW_V3_ENABLED=true
      - CLAUDE_FLOW_HOOKS_ENABLED=true
      - NODE_ENV=production
      - RUFLO_VERSION=3.5.48
      - RUFLO_DIR_NAME
      - DEV_ENV_DIR
      - KEEPASS_DB_PATH
      - REPOS_DIR_NAME
      - WORKSPACE_DIR_NAME
    volumes:
      - ${HOST_RUFLO_DIR}:/opt/${RUFLO_DIR_NAME}
      - ${HOST_REPOS_DIR}:/${REPOS_DIR_NAME}
