services:
  ruflo:
    build:
      context: .
      dockerfile: .devcontainer/ruflo/Dockerfile
      args:
        - CONTAINER_USER
        - CONTAINER_UID
        - RUFLO_DIR_NAME
    image: dev-env-ruflo:latest
    container_name: ruflo
    command: tail -f /dev/null
    environment:
      - CLAUDE_FLOW_V3_ENABLED=true
      - CLAUDE_FLOW_HOOKS_ENABLED=true
      - NODE_ENV=production
      - RUFLO_VERSION=3.5.48
      - RUFLO_DIR_NAME
      - DEV_ENV_DIR
      - KEEPASS_DB_PATH
      - REPOS_DIR_NAME
      - WORKSPACE_DIR_NAME
    volumes:
      - ${HOST_RUFLO_CLAUDE_DIR}:/home/${CONTAINER_USER}/.claude
      - ${HOST_RUFLO_DIR}:/opt/${RUFLO_DIR_NAME}
      - ${HOST_REPOS_DIR}:/${REPOS_DIR_NAME}
      - ${HOST_KEEPASS_DB_PATH}:${KEEPASS_DB_PATH}:ro
    networks:
      - ruflo-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev

networks:
  ruflo-net:
