services:
  multiclaude:
    build:
      context: .
      dockerfile: .devcontainer/multiclaude/Dockerfile
      args:
        - BUF_VERSION
        - CONTAINER_UID
        - CONTAINER_USER
        - GH_VERSION
        - GO_VERSION
        - GOPLS_VERSION
        - MULTICLAUDE_VERSION
    image: dev-env-multiclaude:latest
    container_name: multiclaude
    command: tail -f /dev/null
    environment:
      - NODE_ENV=production
      - MULTICLAUDE_DIR_NAME
      - DEV_ENV_DIR
      - KEEPASS_DB_PATH
      - REPOS_DIR_NAME
      - SKILLS_VERSION
    volumes:
      - ${HOST_MULTICLAUDE_WORKSPACE_DIR}:/home/${CONTAINER_USER}/${MULTICLAUDE_DIR_NAME}
      - ${HOST_CLAUDE_DIR}:/home/${CONTAINER_USER}/.claude
      - ${HOST_MULTICLAUDE_DIR}:/home/${CONTAINER_USER}/.multiclaude
      - ${HOST_REPOS_DIR}:/${REPOS_DIR_NAME}
      - ${HOST_KEEPASS_DB_PATH}:${KEEPASS_DB_PATH}:ro
    networks:
      - multiclaude-net
    init: true
    pids_limit: -1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  multiclaude-net:
