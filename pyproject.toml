[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["archive", "verifications/evidence", ".nox", ".venv", "typings"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^archive/", "^verifications/evidence/", "^\\.nox/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["pykeepass", "pykeepass.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
